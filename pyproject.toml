[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="pycycle"
version="0.1.0"
description="Python import cycle analyzer"
requires-python=">=3.10"
license={text="MIT"}
[project.scripts]
pycycle="pycycle:main"
[tool.setuptools]
package-dir={""="src"}
py-modules=["pycycle"]
